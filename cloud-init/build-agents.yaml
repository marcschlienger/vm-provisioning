#cloud-config
# =============================================================================
# Agents image build — runs on top of ubuntu-base.
# Installs the stable prerequisite shared by agent workspaces: Claude Code. Codex
# and T3 Code are installed once in each VM's writable filesystem during first
# boot so their runtime files never cross an image boundary.
# =============================================================================

write_files:
  # These small installer scripts are baked into the image; the downloaded
  # Codex and T3 Code payloads are not. launch-init runs each installer once.
  - path: /usr/local/sbin/install-codex-cli
    permissions: '0755'
    content: |
      #!/bin/sh
      set -eu

      # Always create a clean instance-local install. This also makes first boot
      # safe if someone launches from an older image that still contains Codex.
      rm -f /usr/local/bin/codex
      rm -rf /usr/local/share/codex/packages/standalone

      installer=$(mktemp /run/codex-install.XXXXXX)
      trap 'rm -f "$installer"' EXIT HUP INT TERM
      curl -fsSL https://chatgpt.com/codex/install.sh -o "$installer"
      CODEX_INSTALL_DIR=/usr/local/bin \
        CODEX_HOME=/usr/local/share/codex \
        CODEX_NON_INTERACTIVE=1 \
        sh "$installer"

  - path: /usr/local/sbin/install-t3-code
    permissions: '0755'
    content: |
      #!/bin/sh
      set -eu

      # Install the T3 Code CLI for the fixed workspace user and run its server
      # as a system service. The release archive is self-contained. Everything
      # lives under the user's ~/.t3 and ~/.local/bin, which keeps `t3 update`
      # free of root. The unit listens on all of the VM's interfaces; its only
      # non-loopback interface is the host-private Incus bridge, so the server is
      # reached from the host (scripts/t3-expose.sh puts it on the tailnet) or
      # through an SSH tunnel to loopback. Safe to rerun: the installer reuses an
      # existing download.
      installer=$(mktemp /run/t3-install.XXXXXX)
      trap 'rm -f "$installer"' EXIT HUP INT TERM
      curl -fsSL https://t3.codes/install.sh -o "$installer"
      chown admin:admin "$installer"
      sudo -u admin env HOME=/home/admin sh "$installer"

      cat > /etc/systemd/system/t3code.service <<'UNIT'
      [Unit]
      Description=T3 Code server
      After=network.target

      [Service]
      Type=simple
      User=admin
      WorkingDirectory=/home/admin
      ExecStart=/home/admin/.local/bin/t3 serve --host 0.0.0.0 --port 3773
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
      UNIT

      systemctl daemon-reload
      systemctl enable --now t3code.service

  # One executable checks image prerequisites during builds and the complete
  # agent stack after first boot and on later re-entry.
  - path: /usr/local/sbin/verify-agent-clis
    permissions: '0755'
    content: |
      #!/bin/sh
      set -eu

      case "${1:-}" in
        "") prerequisites_only=false ;;
        --prerequisites) prerequisites_only=true ;;
        *) echo "Usage: $0 [--prerequisites]" >&2; exit 2 ;;
      esac

      for command_name in claude timeout; do
        if ! command -v "$command_name" >/dev/null 2>&1; then
          echo "ERROR: missing required command: $command_name" >&2
          exit 1
        fi
      done

      echo "==> Verifying Claude Code"
      timeout 30 claude --version

      [ "$prerequisites_only" = false ] || exit 0

      if ! command -v codex >/dev/null 2>&1; then
        echo "ERROR: missing required command: codex" >&2
        exit 1
      fi

      echo "==> Verifying Codex"
      timeout 30 codex --version

      # T3 Code is installed for the workspace user, so run it as that user.
      if [ ! -x /home/admin/.local/bin/t3 ]; then
        echo "ERROR: missing required command: /home/admin/.local/bin/t3" >&2
        exit 1
      fi

      echo "==> Verifying T3 Code"
      timeout 30 sudo -u admin -H /home/admin/.local/bin/t3 --version

runcmd:
  - set -e

  # Claude Code CLI (Anthropic). Use the signed stable apt channel: it is
  # system-wide, native, and intentionally skips releases with major regressions.
  - curl -fsSL https://downloads.claude.ai/keys/claude-code.asc -o /etc/apt/keyrings/claude-code.asc
  - >-
    test "$(gpg --show-keys --with-colons /etc/apt/keyrings/claude-code.asc
    | awk -F: '$1 == "fpr" { print $10; exit }')"
    = 31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE
  - echo 'deb [signed-by=/etc/apt/keyrings/claude-code.asc] https://downloads.claude.ai/claude-code/apt/stable stable main' > /etc/apt/sources.list.d/claude-code.list

  - apt-get update
  - apt-get install -y claude-code

  - apt-get clean && rm -rf /var/lib/apt/lists/*

  # Codex and T3 Code are intentionally absent until a workspace VM's first boot.
  - /usr/local/sbin/verify-agent-clis --prerequisites

final_message: "Agents image build complete."
